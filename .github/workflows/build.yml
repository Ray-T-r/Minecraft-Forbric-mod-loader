# This workflow exists to keep the bootstrap honest.
#
# Forbric does not vendor its fabric-loader substrate: bootstrap.sh clones it at the pinned
# fabric_loader_ref and applies forbric-loader/patches/fabric-loader/, and only then does the build have
# a complete source set. That is the fragile part of a clean clone -- if the pinned tag moves, a patch
# stops applying, or the build stops compiling against the substrate, this job goes red.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # forbric-loader/build.gradle pins its output to release 17 but compiles with whatever JDK runs
      # Gradle, so any JDK >= 17 works. 21 is the current LTS and is supported by the checked-in Gradle
      # wrapper (9.1); pinning it keeps CI on one known-good combination rather than tracking the runner
      # image's default JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Clones FabricMC/fabric-loader into ./fabric-loader, applies the patches, and verifies them.
      - name: Bootstrap substrate
        run: ./bootstrap.sh

      - name: Build
        run: cd forbric-loader && ./gradlew build

      # forbric-loader/build.gradle's `assemble` produces both: the parent-loaded loader core and
      # forbricruntime (the Knot-loaded half).
      - uses: actions/upload-artifact@v5
        with:
          name: forbric-jars
          path: forbric-loader/build/libs/*.jar
          if-no-files-found: error

  # The kernel is a second, independent build with its own wrapper. It is here for one specific reason:
  # forbric-kernel/build.gradle wires its GAME-side source set at CONFIGURATION time, and only when the
  # staged game artifacts are present. Those artifacts embed Mojang/Forge/NeoForge code and are built on
  # the user's own machine, so they are never in this repository and never on a runner -- which makes this
  # job the honest test of the claim that their absence costs a clean clone nothing. If that ever stops
  # being true, the boot jar silently ships without its game-side half, and this goes red instead.
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The kernel pins `options.release = 21` but needs no specific JDK to compile; 21 matches the floor.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # No bootstrap step: the kernel does not compile the fabric-loader substrate. It vendors the small
      # net.fabricmc.api surface it needs and is otherwise its own code.
      # check now includes portable Python tools and the packaged link gate's negative controls.
      # This remains a boot-only check: the integrationTest task is for machines with prepared game fixtures.
      # Without game files about a third of the unit tests skip. skipBaseline holds that set to the committed
      # forbric-kernel/src/test/skip-baseline/ci-unstaged.tsv: a test that starts skipping turns this job red.
      - name: Build and check (boot only)
        shell: bash
        run: cd forbric-kernel && ./gradlew build -Pforbric.skipBaseline=ci-unstaged

      # A skipped test passes the build, so say on the run page how many ran and how many skipped, and why.
      - name: Test summary
        if: always()
        shell: bash
        run: >-
          python tools/junit_report.py summary --title 'Kernel tests (no game files)'
          --results forbric-kernel/build/test-results --root "$GITHUB_WORKSPACE"
          --baseline forbric-kernel/src/test/skip-baseline/ci-unstaged.tsv >> "$GITHUB_STEP_SUMMARY"

      # This runner has no Mojang, Forge or NeoForge bytes (the game-side set is not compiled), so the raw reports
      # are safe to publish: anyone can see which test skipped and why.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kernel-test-results
          path: |
            forbric-kernel/build/test-results/
            forbric-kernel/build/reports/tests/
            forbric-kernel/build/skip-baseline/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: forbric-kernel-jar
          path: forbric-kernel/build/libs/*.jar
          if-no-files-found: error

  # The same unit suite with the game files present, so the ~1000 tests the boot-only job has to skip run here.
  # tools/dev.py prepare downloads Minecraft 26.2 from Mojang and the Forge / NeoForge userdev artifacts from their
  # own mavens, and builds the merged base and carriers on this runner, the way Loom and NeoGradle prepare a CI
  # workspace. Nothing derived from them leaves the runner: only upstream downloads are cached, the reports below are
  # counts and test ids, and a guard refuses to upload any jar or JUnit XML (a failing bytecode comparison can print
  # disassembled game code into a test message).
  kernel-prepared:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            forbric-kernel/.dev/minecraft/libraries
            forbric-kernel/.dev/minecraft/versions
            forbric-kernel/.dev/minecraft/.forbric-build/dl
            forbric-kernel/.dev/api
          key: dev-inputs-${{ runner.os }}-${{ hashFiles('forbric-kernel-installer/src/main/java/net/forbric/installer/kernel/Pins.java', 'tools/dev.py') }}
      - name: Prepare the game files (no assets)
        run: python tools/dev.py prepare --no-assets
      # Same ratchet as the boot-only job, against its own baseline: what still skips here needs third-party mod
      # packs that are not in this repository. Every other kind of fixture is prepared above, so requireFixtures
      # turns a skip for any of them (or an untagged skip) into a failure at the test that skipped.
      - name: Unit and transfer tests with the game files
        shell: bash
        run: cd forbric-kernel && ./gradlew jar test transferTest skipRatchet -Pforbric.skipBaseline=ci-prepared -Pforbric.requireTransfer=true -Pforbric.requireFixtures=staged,game-side,mc-libraries,java-25
      # forbric-loader's merge-loss ratchet (MergedBaseHookLossRatchetTest) holds the merge to the platform calls the
      # edit splice keeps. It reads a merged base together with the build record run/build-merged-base.sh writes
      # beside it, which pairs the jar with its report; anywhere without one it skips, so this is the one place it
      # runs. Build that base from the inputs prepared above into a stage of its own, and require it present.
      - name: Merge-loss ratchet on the prepared inputs
        shell: bash
        env:
          MC_DIR: ${{ github.workspace }}/forbric-kernel/.dev/minecraft
        run: |
          ./bootstrap.sh
          staged="$GITHUB_WORKSPACE/forbric-kernel/.dev/staged/run"
          ratchet="$RUNNER_TEMP/ratchet"
          mkdir -p "$ratchet/run/merged-base"
          ln -sfn "$staged/forge-patched" "$ratchet/run/forge-patched"
          ln -sfn "$staged/neoforge-patched" "$ratchet/run/neoforge-patched"
          (cd forbric-loader && ./gradlew -q toolsClasses)
          FORGE="$staged/forge-patched/patched-mc-forge-26.2.jar" NEO="$staged/neoforge-patched/patched-mc-neoforge-26.2.jar" \
          FORGE_RT="$staged/forge-runtime/forge-runtime.jar" NEO_RT="$staged/neoforge-runtime/neoforge-runtime.jar" \
          OUT="$ratchet/run/merged-base/patched-mc-merged-26.2.jar" REPORT="$ratchet/run/merged-base/merge-conflicts.txt" \
          FORGE_RT_PATCHED="$ratchet/run/merged-base/forge-runtime-interop.jar" \
            bash forbric-loader/run/build-merged-base.sh
          cd forbric-loader
          FORBRIC_OLD="$ratchet" FORBRIC_COMPAT_FIXTURES_REQUIRED=1 ./gradlew test --tests net.forbric.tools.MergedBaseHookLossRatchetTest
      # Real dedicated servers through the kernel, on the same prepared files: a zero-mod boot (m1) and the gates whose
      # mods are canaries built from this repository's sources. m36 weaves real guest mixins in a running server and
      # checks what they did (its weave-level half also runs in the unit suite, see MixinOutcomeWeaveTest); m46 and m53
      # check mixins written against vanilla that the merged game reshaped. Each gate writes eula.txt for its own
      # throwaway server, as it does on a developer machine.
      - name: Server gates on the prepared files
        shell: bash
        env:
          FORBRIC_OLD: ${{ github.workspace }}/forbric-kernel/.dev/staged
          MC_DIR: ${{ github.workspace }}/forbric-kernel/.dev/minecraft
        run: |
          cd forbric-kernel
          ./gradlew -q runtimeJar
          export FORBRIC_SPONGE_MIXIN="$(./gradlew -q printBootClasspath | tr ':' '\n' | grep '/sponge-mixin-' | head -1)"
          export M46_FABRIC_API="$PWD/.dev/api/fabric-api-0.155.2+26.2.jar" M53_FABRIC_API="$PWD/.dev/api/fabric-api-0.155.2+26.2.jar"
          failed=0
          for gate in m1 m36-mixin-outcome m46-stub-rebind m53-widened-new; do
            start=$(date +%s)
            if bash "run/gate-$gate.sh" > "build/gate-$gate.out" 2>&1; then verdict=GREEN; else verdict=RED; failed=1; fi
            echo "gate-$gate $verdict in $(( $(date +%s) - start ))s" | tee -a build/gates-prepared.txt
            [ "$verdict" = GREEN ] || tail -80 "build/gate-$gate.out"
          done
          { echo '### Server gates on the prepared files'; echo; sed 's/^/- /' build/gates-prepared.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Test summary
        if: always()
        shell: bash
        run: >-
          python tools/junit_report.py summary --title 'Kernel tests (game files prepared on this runner)'
          --results forbric-kernel/build/test-results --root "$GITHUB_WORKSPACE"
          --baseline forbric-kernel/src/test/skip-baseline/ci-prepared.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse to publish game-derived files
        if: always()
        shell: bash
        run: |
          if find forbric-kernel/build/skip-baseline -type f ! -name 'skips-actual-*.tsv' 2>/dev/null | grep -q .; then
            echo "unexpected file in the upload set"; exit 1
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kernel-prepared-skips
          path: forbric-kernel/build/skip-baseline/
          if-no-files-found: warn
          retention-days: 30

  # Verify the new portable entry point and packaged merge link gate on each OS, without game downloads.
  # Legacy Bash gate contracts remain covered by the Linux kernel job above.
  development-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Portable development and evidence tool tests
        run: python tools/dev.py tool-test
      - name: Packaged link gate positive and negative controls (no bootstrap)
        shell: bash
        run: ./forbric-kernel-installer/gradlew -p forbric-kernel-installer linkGateTest
