plugins {
	id 'java'
}

group = 'net.forbric'
version = '0.4.0-dev'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

// The installer carries Forbric's OWN jars and nothing else. NeoForge's patched game and the NeoForge runtime
// embed Mojang's and NeoForge's code, so they are never bundled — the installer builds them on the player's
// machine (ArtifactBuilder), or takes a developer's build (--artifacts, GameArtifacts).
def kernelDir = file('../forbric-kernel')
// Read from each module's own build file rather than spelled out here. The four literals this replaces named
// `-0.1.0-SNAPSHOT` jars that forbric-loader stopped writing when it dropped the suffix, so every installer
// built since bundled whatever stale jar was still lying in build/libs, and a clean clone could not build at
// all: the name it asked for was one nothing would ever produce.
def moduleVersion = { File dir ->
	def m = (dir.toPath().resolve('build.gradle').toFile().text =~ /(?m)^version\s*=\s*['"]([^'"]+)['"]/)
	if (!m) throw new GradleException("no version in ${dir}/build.gradle")
	m[0][1]
}
def kernelJar  = { "forbric-kernel-${moduleVersion(kernelDir)}.jar" }
def genResources = layout.buildDirectory.dir('generated-resources')
// The kernel's link checker rides in EVERY build, slim included, as one standalone jar (its classes and ASM's core):
// every install runs it over the base and the NeoForge runtime (LinkCheckTool) before it stages any of Forbric's jars,
// so a slim installer could not take it from the kernel jar it has not fetched yet. It is under 200 KB.
def genLinkCheck = layout.buildDirectory.dir('generated-link-check')
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
// What the kernel's :linkCheckJar writes, and the checker's sources: a change to either must reach the installer.
def linkCheckJar = file("${kernelDir}/build/link-check/forbric-link-check.jar")
def linkCheckSources = file("${kernelDir}/src/main/java/net/forbric/kernel/linkcheck")
// The kernel's :linkCheckJar records the sources it was built from in its manifest (Forbric-LinkCheck-Sources); this is the
// same digest of this tree's sources (linkcheck/*.java and the ASM version), so a checker built from other sources is
// refused rather than bundled -- `-x buildLinkCheck` after a source change nothing rebuilt would otherwise ship it.
def linkCheckSourceDigest = {
	def asm = (file("${kernelDir}/gradle.properties").text =~ /(?m)^asm_version\s*=\s*(\S+)/)
	if (!asm) throw new GradleException("no asm_version in ${kernelDir}/gradle.properties")
	def md = java.security.MessageDigest.getInstance('SHA-256')
	md.update("asm ${asm[0][1]}\n".getBytes('UTF-8'))
	(linkCheckSources.listFiles().findAll { it.isFile() && it.name.endsWith('.java') }).sort { it.name }.each { f ->
		md.update("${f.name}\n".getBytes('UTF-8'))
		md.update(f.bytes)
		md.update((byte) 0)
	}
	md.digest().encodeHex().toString()
}

tasks.register('buildForbricJars', Exec) {
	description = "Build the kernel jar the installer bundles."
	workingDir kernelDir
	// --no-daemon, like every nested wrapper call here: otherwise it joins the daemon pool and outlives a --no-daemon build.
	commandLine(isWindows ? ['cmd', '/c', 'gradlew.bat', '--no-daemon', 'jar'] : ['./gradlew', '--no-daemon', 'jar'])
	inputs.dir("${kernelDir}/src/main")
	inputs.file("${kernelDir}/build.gradle")
	outputs.dir("${kernelDir}/build/libs")
}

// The kernel's link checker as one jar, built from the kernel tree (net.forbric.kernel.linkcheck), shaded with ASM's
// core. Not a library of the installer's: it is run as a subprocess, so the jar travels as a resource and is unpacked.
tasks.register('buildLinkCheck', Exec) {
	description = "Build the kernel's standalone link-checker jar the installer ships and runs."
	workingDir kernelDir
	commandLine(isWindows ? ['cmd', '/c', 'gradlew.bat', '--no-daemon', 'linkCheckJar'] : ['./gradlew', '--no-daemon', 'linkCheckJar'])
	inputs.dir(linkCheckSources).withPropertyName('linkCheckSources')
	inputs.file("${kernelDir}/build.gradle")
	inputs.file("${kernelDir}/gradle.properties").withPropertyName('asmVersion')
	// The one file this task makes; the kernel's build/libs is shared with tasks whose outputs must not decide this one.
	outputs.file(linkCheckJar)
}

tasks.register('bundleLinkCheck') {
	description = "Copy the kernel's link-checker jar into the installer's resources."
	dependsOn 'buildLinkCheck'
	inputs.file(linkCheckJar).withPropertyName('linkCheck').withPathSensitivity(PathSensitivity.NONE)
	// The sources too: a source change with the jar left as it was must re-run this task, so the check below sees it.
	inputs.files(fileTree(linkCheckSources) { include '*.java' }).withPropertyName('linkCheckSources')
	outputs.dir(genLinkCheck)
	doLast {
		if (!linkCheckJar.isFile()) throw new GradleException("missing ${linkCheckJar} — run the kernel's :linkCheckJar")
		def built = new java.util.jar.JarFile(linkCheckJar).withCloseable { it.manifest?.mainAttributes?.getValue('Forbric-LinkCheck-Sources') }
		def tree = linkCheckSourceDigest()
		if (built != tree) {
			throw new GradleException("${linkCheckJar} was built from other link-checker sources than this tree's (jar ${built ?: 'names none'},"
					+ " tree ${tree}): run the kernel's :linkCheckJar, or this task without -x buildLinkCheck")
		}
		def outDir = genLinkCheck.get().asFile
		outDir.deleteDir()
		def dest = new File(outDir, 'forbric/tools/forbric-link-check.jar')
		dest.parentFile.mkdirs()
		dest.bytes = linkCheckJar.bytes
		println "bundleLinkCheck → ${linkCheckJar.length().intdiv(1024)} KB"
	}
}

// Development preparation needs the artifact builder and the link checker, not a player payload or Fabric substrate.
// Avoid processResources here: that task intentionally builds the complete player installer payload.
tasks.register('devToolsJar', Jar) {
	group = 'development'
	description = 'Build the portable development artifact preparer without the player payload.'
	dependsOn 'compileJava', 'bundleLinkCheck'
	archiveFileName = 'forbric-dev-tools.jar'
	from sourceSets.main.output.classesDirs
	from genLinkCheck
	manifest { attributes 'Main-Class': 'net.forbric.installer.kernel.DevPrepare' }
}

// This module's tests are main() programs, not a JUnit suite: InstallerTests runs every *Test class under src/test/java,
// found by name, so a new test joins without an edit here (and one without a runnable main fails the run). They need the
// checker as the installer carries it (LinkCheckToolTest runs it as the install does), not the player payload.
// So they compile here, against the installer's classes only. The stock compileTestJava puts all of main's output on its
// class path, resources included, and main's resources are the player payload: processResources -> bundleForbric ->
// buildForbricJars, a nested kernel build that runs online and without the caller's -P settings (and, from the kernel's
// own `check`, inside a kernel build).
def installerTestClasses = tasks.register('compileInstallerTests', JavaCompile) {
	dependsOn 'compileJava'
	source = fileTree('src/test/java') { include '**/*.java' }
	classpath = files(sourceSets.main.output.classesDirs)
	destinationDirectory = layout.buildDirectory.dir('installer-test-classes')
}
tasks.register('installerTest', JavaExec) {
	group = 'verification'
	description = "Run the installer's tests: the packaged link check on synthetic jars, and every other *Test main."
	dependsOn installerTestClasses, 'bundleLinkCheck'
	classpath = files(installerTestClasses.flatMap { it.destinationDirectory }, sourceSets.main.output.classesDirs, genLinkCheck)
	mainClass = 'net.forbric.installer.kernel.InstallerTests'
	doFirst {
		def scratch = layout.buildDirectory.dir('installer-test').get().asFile
		scratch.deleteDir()
		scratch.mkdirs()
		args = [scratch.absolutePath, installerTestClasses.get().destinationDirectory.get().asFile.absolutePath]
	}
}
tasks.named('check') { dependsOn 'installerTest' }
// The stock test task finds no JUnit tests here -- which Gradle 9 makes a failure, and with it every `check`.
tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('bundleForbric') {
	description = "Copy Forbric's own jars into the installer's resources, with a manifest describing them."
	dependsOn 'buildForbricJars'
	// Without these the task is "up to date" the moment its output directory exists, and the installer keeps
	// shipping whichever kernel jar it bundled first — an install that silently predates the fix you just made.
	inputs.files(file("${kernelDir}/build/libs/${kernelJar()}"))
			.withPropertyName('forbricJars')
			.withPathSensitivity(PathSensitivity.NONE)
	outputs.dir(genResources)
	doLast {
		// Clear the WHOLE output directory, not just forbric/libs. It once also held the merge-tools jar; when
		// that moved to its own task the stale copy stayed behind and collided with the new one, which
		// processResources reports as a duplicate entry rather than as the stale output it is. The link checker has
		// its own directory (bundleLinkCheck) for the same reason.
		def outDir = genResources.get().asFile
		outDir.deleteDir()
		def libsRoot = new File(outDir, 'forbric/libs')
		libsRoot.mkdirs()

		def entries = []
		def add = { String coordinate, File src ->
			if (!src.isFile()) throw new GradleException("missing ${src} — build it first")
			def parts = coordinate.split(':')
			def rel = "${parts[0].replace('.', '/')}/${parts[1]}/${parts[2]}/${parts[1]}-${parts[2]}.jar"
			def dest = new File(libsRoot, rel)
			dest.parentFile.mkdirs()
			dest.bytes = src.bytes
			entries << [coordinate: coordinate, resource: "/forbric/libs/${rel}", path: rel,
			            sha1: java.security.MessageDigest.getInstance('SHA-1').digest(src.bytes).encodeHex().toString(),
			            size: src.length()]
		}

		// Forbric's own code (Apache-2.0).
		// The old loader's forbric-loader and forbricruntime jars used to ride along: bundled when the kernel still
		// needed them at run time (2026-09-09), left in after it stopped (2026-09-12). Nothing in a pack or in the
		// kernel resolves a class only they provide, and they put 48 duplicate net.fabricmc.* classes on the
		// player's classpath, where classpath order decided which copy won.
		add('net.forbric:forbric-kernel:' + project.version, new File(kernelDir, "build/libs/${kernelJar()}"))

		// The kernel's own third-party dependencies, taken from the classpath the kernel itself reports so the
		// installed profile cannot drift from what the gates run. All permissively licensed; staged locally so a
		// launch needs no network and no guess about which Maven still carries a given version.
		def command = isWindows ? ['cmd', '/c', 'gradlew.bat', '--offline', '--no-daemon', '-q', 'printBootClasspath']
				: ['./gradlew', '--offline', '--no-daemon', '-q', 'printBootClasspath']
		def process = new ProcessBuilder(command).directory(kernelDir).redirectErrorStream(true).start()
		def cpOut = process.inputStream.text
		if (process.waitFor() != 0) {
			throw new GradleException("could not ask the kernel for its classpath:\n" + cpOut)
		}
		def cacheRoot = 'modules-2/files-2.1/'
		cpOut.readLines().findAll { it.contains(File.pathSeparator) }.last()
				.split(File.pathSeparator).each { String entry ->
			def jar = new File(entry)
			if (!jar.isFile() || !entry.contains(cacheRoot)) return   // Forbric's own jars are added above
			// <cache>/files-2.1/<group>/<name>/<version>/<sha>/<file>.jar
			def rest = entry.substring(entry.indexOf(cacheRoot) + cacheRoot.length()).split('/')
			if (rest.length < 5) return
			add("${rest[0]}:${rest[1]}:${rest[2]}".toString(), jar)
		}
		new File(outDir, 'forbric-kernel-libraries.json').text =
				groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([version: project.version, libraries: entries]))
		println "bundleForbric → ${entries.size()} jar(s), ${entries.sum { it.size } / 1024 / 1024} MB"
	}
}

// The link checker is staged, never listed in the libraries manifest: it is a tool the installer runs as a subprocess,
// not something the installed profile puts on a classpath.
sourceSets.main.resources.srcDir genLinkCheck
processResources.dependsOn 'bundleLinkCheck'

// A slim installer carries no library payload and downloads it from the release at install time. The bundled
// build stays the default because it is the one that works with no network.
//   ./gradlew jar             bundled (self-contained)
//   ./gradlew jar -Pslim      slim (downloads Forbric's jars at install time)
def slim = project.hasProperty('slim')
if (!slim) {
	sourceSets.main.resources.srcDir genResources
	processResources.dependsOn 'bundleForbric'
}

// Bake the release coordinates into the jar. RemoteSource reads this at runtime; its manifestSha256 is the
// trust anchor that makes the manifest's per-jar digests mean something, because it is the one digest an
// attacker who controls the release cannot rewrite.
if (project.hasProperty('releasePin')) {
	def pin = file(project.property('releasePin'))
	if (!pin.isFile()) throw new GradleException("releasePin file not found: ${pin}")
	processResources {
		from(pin) { rename '.*', 'forbric-release.properties' }
		// `from` a file that has since vanished copies nothing and says nothing — that would produce an
		// installer that looks pinned, is not, and only says so as a warning on a user's machine. So check at
		// execution time too: `clean jar -PreleasePin=build/...` deletes the pin before this task runs.
		doLast {
			def landed = new File(destinationDir, 'forbric-release.properties')
			if (!landed.isFile()) {
				throw new GradleException("-PreleasePin was given but ${pin} did not reach the jar. If you ran"
						+ " `clean` in the same invocation it deleted the pin first: re-run :releaseAssets,"
						+ " then build without clean.")
			}
		}
	}
}

// ---- GitHub release assets: what gets uploaded, and the manifest a slim installer downloads ----
//
// Two-step on purpose, and the order cannot be collapsed: the pin is a digest of the manifest, so the manifest
// has to exist before the installer that pins it is built.
//
// What is published must be what was accepted. releaseAssets therefore takes the release acceptance's evidence
// manifests (evidence.py run --release, comma-separated) and refuses to write any asset unless
// `evidence.py release-check` finds them all passed, bound to one candidate, and the kernel jar about to ship
// byte-identical to the accepted one. The kernel's third-party libraries are published as the pinned Maven artifacts
// they are and are not compared. The game artifacts are never published: each player's installer builds them from
// Mojang's and NeoForge's files, so for them the installer's link check is the gate. That check is the kernel's own
// (net.forbric.kernel.linkcheck, built into the installer by :bundleLinkCheck from the same tree), not an asset.
//
//   ./gradlew releaseAssets -PreleaseTag=v0.1.0 -PreleaseEvidence=build/evidence/release.json
//   gh release create v0.1.0 build/release/assets/*
//   ./gradlew jar -Pslim -PreleasePin=build/release/forbric-release.properties     (NOT with `clean`)
//   gh release upload v0.1.0 build/libs/forbric-kernel-installer-*.jar
tasks.register('releaseAssets') {
	description = 'Write build/release/: the jars to attach to a GitHub release + the manifest the installer downloads.'
	dependsOn 'bundleForbric'
	def repo = project.findProperty('releaseRepo') ?: 'https://github.com/Ray-T-r/Minecraft-Forbric-mod-loader'
	def outRoot = layout.buildDirectory.dir('release')
	outputs.dir(outRoot)
	doLast {
		def tag = project.findProperty('releaseTag')
		if (!tag) throw new GradleException('releaseAssets needs -PreleaseTag=<tag>, e.g. -PreleaseTag=v0.1.0')
		def staged = new File(genResources.get().asFile, 'forbric-kernel-libraries.json')
		if (!staged.isFile()) throw new GradleException("missing ${staged} — run :bundleForbric first")
		def manifest = new groovy.json.JsonSlurper().parse(staged)

		def evidence = project.findProperty('releaseEvidence')
		if (!evidence) {
			throw new GradleException('releaseAssets needs -PreleaseEvidence=<manifest.json>[,...] from the release'
					+ ' acceptance (evidence.py run --release); an unaccepted build is not published')
		}
		def kernelLib = manifest.libraries.find { (it.coordinate as String).startsWith('net.forbric:forbric-kernel:') }
		if (kernelLib == null) throw new GradleException("${staged} lists no forbric-kernel jar")
		def check = ['python3', new File(kernelDir, 'run/compat/evidence.py').path, 'release-check']
		(evidence as String).split(',').each { check += ['--manifest', file(it.trim()).path] }
		check += ['--publish', "kernel=${new File(genResources.get().asFile, (kernelLib.resource as String).substring(1))}"]
		def checking = new ProcessBuilder(check.collect { it.toString() }).redirectErrorStream(true).start()
		def verdict = checking.inputStream.text
		if (checking.waitFor() != 0) {
			throw new GradleException("the jars about to be published are not the accepted ones:\n" + verdict)
		}
		println verdict.trim()

		def root = outRoot.get().asFile
		def assets = new File(root, 'assets')
		assets.deleteDir()
		assets.mkdirs()

		// The released manifest carries NO 'resource' field: every entry must be downloaded. That is what makes
		// a slim installer actually go to the network instead of quietly preferring a payload it does not have.
		def released = [version: manifest.version, release: [tag: tag, repo: repo], libraries: []]
		manifest.libraries.each { lib ->
			def src = new File(genResources.get().asFile, (lib.resource as String).substring(1))
			if (!src.isFile()) throw new GradleException("staged jar for ${lib.coordinate} not found: ${src}")
			// The asset name MUST come from the COORDINATE, never from the source file's name: the installer
			// asks for the basename Util.coordinateToPath produces. A name derived any other way 404s at
			// install time for every user, and never on the machine that published it.
			def parts = (lib.coordinate as String).split(':')
			def basename = parts[1] + '-' + parts[2] + (parts.length > 3 ? '-' + parts[3] : '') + '.jar'
			def dest = new File(assets, basename)
			if (dest.exists()) throw new GradleException("two libraries would upload as the same asset: ${basename}")
			dest.bytes = src.bytes
			released.libraries << [coordinate: lib.coordinate, path: lib.path, sha1: lib.sha1, size: lib.size]
		}

		def manifestFile = new File(assets, 'forbric-kernel-libraries.json')
		manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(released))

		def sha256 = java.security.MessageDigest.getInstance('SHA-256')
				.digest(manifestFile.bytes).collect { String.format('%02x', it) }.join('')
		def pin = new File(root, 'forbric-release.properties')
		pin.text = "# Written by :releaseAssets. Baked into the installer jar via -PreleasePin.\n" +
				"repo=${repo}\ntag=${tag}\nmanifestSha256=${sha256}\n"

		println "releaseAssets -> ${assets} (${released.libraries.size()} jars + manifest)"
		println "  manifest sha256 : ${sha256}"
		println "  next            : gh release create ${tag} ${assets}/*"
		println "                    ./gradlew jar -Pslim -PreleasePin=${pin}"
	}
}

// ---- Release bundle: the runnable jar plus the double-click launchers ----
//
// The launchers are not a convenience. A Minecraft player often has NO system Java at all — the only JVM on the
// machine is the one the launcher downloaded for the game, which is not on PATH and not what the .jar file
// association points at. These scripts search JAVA_HOME, then PATH, then the launcher's own runtime folder, so
// double-clicking works on exactly the machine that has no Java of its own. Dropping them silently breaks the
// README's promise that you do not need to install Java yourself.
tasks.register('releaseZip', Zip) {
	description = 'Assemble build/dist/forbric-kernel-installer-<ver>.zip (runnable jar + .command/.bat launchers).'
	dependsOn 'jar'
	archiveFileName = "forbric-kernel-installer-${version}.zip"
	destinationDirectory = layout.buildDirectory.dir('dist')
	from(tasks.named('jar').flatMap { it.archiveFile })
	from('packaging/Forbric-Installer.command') { filePermissions { unix('0755') } }
	from('packaging/Forbric-Installer.bat')
}

jar {
	archiveBaseName = 'forbric-kernel-installer'
	manifest {
		attributes 'Main-Class': 'net.forbric.installer.kernel.Main'
		// The window shows this back to the user. Without it Package.getImplementationVersion() is null on
		// every build, and the field fell back to a literal that was right once and then was not: an installer
		// built at 0.2.0 told the user it was 0.1.0.
		attributes 'Implementation-Title': 'Forbric Installer'
		attributes 'Implementation-Version': project.version
	}
	// The kernel's own dependencies are resolved by the launcher from Maven; only Forbric's jars ride along.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
