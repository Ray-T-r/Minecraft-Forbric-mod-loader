org.gradle.jvmargs=-Xmx1536M

group = net.forbric
description = A clean-room unified Minecraft mod loader for Fabric and Forge mods
url = https://github.com/Ray-T-r/Minecraft-Forbric-mod-loader

# Substrate (reused from fabric-loader, Apache-2.0).
# fabric_loader_ref is the single source of truth for WHICH upstream release Forbric builds against:
# bootstrap.sh clones it, run/verify-substrate-patches.sh diffs against it, and the dependency
# versions below are the ones that release resolves.
fabric_loader_ref = 0.19.3

asm_version = 9.10.1
mixin_version = 0.17.3+mixin.0.8.7
mixin_extras_version = 0.5.4
sat4j_version = 2.3.6
tiny_remapper_version = 0.14.0
class_tweaker_version = 0.3.0-beta.2
mapping_io_version = 0.7.1

# Clean-room Forge side
night_config_version = 3.8.1

junit_version = 5.9.2
