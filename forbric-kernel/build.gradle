plugins {
	id 'java'
	id 'java-library'
}

base {
	archivesName = 'forbric-kernel'
}

version = '0.1.0-SNAPSHOT'

java {
	// The sovereign kernel raises the floor to Java 21 (records, pattern switch, sealed types). The game itself
	// needs Java 25, but the boot-side kernel bytecode only needs 21; we pin release 21 so the build runs on any
	// JDK >= 21 without a separate toolchain (this machine ships JDK 25).
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Staged local artifacts the GAME-side (runtime) source set links against, compileOnly. Produced by the shared
// forbric-loader pipeline (kept as-is): run/build-merged-base.sh + run/assemble-{minecraftforge,neoforge}-runtime.sh.
// These are LGPL / Mojang-derived and are NEVER bundled — compileOnly linkage only, runtime-supplied by the user
// or installer, exactly as the old system does. The kernel stays base-jar-parametric at launch (--gameJar).
//
// The root is overridable with -Pforbric.stagedRoot=<dir> for ONE reason: the claim that a machine WITHOUT
// staged artifacts still builds an unchanged boot jar has to be testable on a machine that has them. Pointing
// it at a directory that does not exist reproduces that machine exactly, in one command, without moving a
// 35MB file another session may be running from.
// -Pforbric.stagedRoot wins; then FORBRIC_OLD, which is the one variable the run/ scripts also read, so a
// second working tree needs exactly one export rather than a different knob per tool.
def devStage = file('.dev/staged/run')
def stagedRoot         = file(project.findProperty('forbric.stagedRoot')
		?: (System.getenv('FORBRIC_OLD') ? System.getenv('FORBRIC_OLD') + '/run'
				: (new File(devStage, 'merged-base/patched-mc-merged-26.2.jar').isFile() ? devStage : '../forbric-loader/run')))
def stagedMergedBase   = new File(stagedRoot, 'merged-base/patched-mc-merged-26.2.jar')
def stagedForgeRuntime = new File(stagedRoot, 'forge-runtime/forge-runtime.jar')
def stagedNeoRuntime   = new File(stagedRoot, 'neoforge-runtime/neoforge-runtime.jar')
def stagedGameJars = [stagedMergedBase, stagedForgeRuntime, stagedNeoRuntime].findAll { it.isFile() }

// Compile the transfer bridge against the exact API staged for the compatibility pack. These modules remain
// supplied by the installed Fabric API mod; none is bundled in either kernel jar.
//
// The transfer package is NOT optional in a built game side. It was: a missing dev-pack jar here quietly
// excluded net/forbric/kernel/runtime/transfer/** from a runtime jar that was still built and nested, the build
// stayed green, and every player with fabric-api then met KernelTransferInterop's required loss "this kernel build
// is missing its transfer component" -- a dedicated server exited 78 on a pack that launched before the bridge
// existed. A machine that builds the game side must supply the API (-Pforbric.fabricApi=<fabric-api jar>) or the
// build fails naming the file; a machine with no staged game jars builds neither half, exactly as before.
def devFabricApi = file('.dev/api/fabric-api-0.155.2+26.2.jar')
def stagedFabricApi = file(project.findProperty('forbric.fabricApi') ?: (devFabricApi.isFile() ? devFabricApi
		: new File(stagedRoot.parentFile.parentFile, 'forbric-kernel/run/client-merged-pack/mods/fabric-api-0.155.2+26.2.jar')))
def transferApiModules = ['fabric-transfer-api-v1-', 'fabric-api-lookup-api-v1-', 'fabric-api-base-']
def transferModulesDir = layout.buildDirectory.dir('transfer-api-compile')
def extractTransferApis = tasks.register('extractTransferApis', Sync) {
	onlyIf { !stagedGameJars.isEmpty() }
	// Lazy, so a missing jar reaches compileRuntimeJava's message instead of failing while inputs are snapshotted.
	from { stagedFabricApi.isFile() ? zipTree(stagedFabricApi) : files() }
	include transferApiModules.collect { "META-INF/jars/${it}*.jar" }
	eachFile { path = name }
	includeEmptyDirs = false
	into transferModulesDir
	// A fabric-api jar nesting two versions of one module would put both on the compile path; one of each.
	doLast {
		def extracted = transferModulesDir.get().asFile.listFiles()*.name
		transferApiModules.each { prefix ->
			def found = extracted.findAll { it.startsWith(prefix) && it.endsWith('.jar') }
			if (found.size() != 1) throw new GradleException("${stagedFabricApi} must nest exactly one ${prefix}*.jar; found ${found}")
		}
	}
}
def transferModuleFiles = files(fileTree(transferModulesDir) { include '*.jar' }).builtBy(extractTransferApis)
// Team Reborn Energy 5.0.0 (mod id team_reborn_energy, MIT), the energy API Fabric mods use: Fabric API has none.
// The energy half of the transfer component compiles against it and, like the transfer modules, it is never bundled:
// a pack that wants Fabric energy installs it as an ordinary mod. Same rule as above: a machine that builds the game
// side must supply it (-Pforbric.rebornEnergy=<energy jar>) or the build fails naming the file, so no game side can
// quietly ship without the energy bridge.
//
// Builds accept any implementation/release that preserves the declared public binary API. A file hash is
// identity evidence, not ABI compatibility; ApiJarContract checks members without initializing mod classes.
def rebornEnergyDefaults = [file('.dev/api/energy-5.0.0.jar'),
		new File(stagedRoot.parentFile.parentFile, 'forbric-kernel/run/energy-api/energy-5.0.0.jar'),
		file('run/energy-api/energy-5.0.0.jar')]
def stagedRebornEnergy = file(project.findProperty('forbric.rebornEnergy')
		?: (rebornEnergyDefaults.find { it.isFile() } ?: rebornEnergyDefaults[0]))
// Integration runs pass -Pforbric.requireTransfer=true: there a skipped transfer suite is a failure, not a pass.
def strictIntegration = gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'integrationTest' }
def requireTransfer = project.findProperty('forbric.requireTransfer') == 'true' || strictIntegration
// CI passes -Pforbric.skipBaseline=<profile>: then the tests skipped in this invocation must equal the committed
// src/test/skip-baseline/<profile>.tsv (see skipRatchet). A skip passes Gradle, so without this a test that started
// skipping looks exactly like one that passed.
def skipBaseline = project.findProperty('forbric.skipBaseline')
if (skipBaseline != null && !(skipBaseline ==~ /[a-z0-9-]+/)) {
	throw new GradleException("forbric.skipBaseline must be [a-z0-9-]+, got '${skipBaseline}'")
}

// Minecraft's OWN libraries, for the game-side set only. A game-side class cannot build a piece of text without
// brigadier: net.minecraft.network.chat.Component extends com.mojang.brigadier.Message, so javac needs it to read
// the Component class file at all. It is not on Maven Central (Mojang's own maven serves it), the game supplies it
// at runtime, and the kernel never ships it — so it is taken from the same local Minecraft install the staged
// artifacts were derived from, and its absence is not fatal: it costs the game-side set, which already skips when
// the staged jars are absent.
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def defaultMinecraft = osName.contains('windows')
		? new File(System.getenv('APPDATA') ?: System.getProperty('user.home') + '/AppData/Roaming', '.minecraft')
		: new File(System.getProperty('user.home'), osName.contains('mac') ? 'Library/Application Support/minecraft' : '.minecraft')
def devMinecraft = file('.dev/minecraft')
// .dev/minecraft is preferred only while it has its version JSON, because the transfer suite's library list below is
// read from that JSON. A tree without it is a tree with no libraries as far as that list goes. One here had all 73
// jars it needs and no 26.2.json (removed after prepare had finished; what removed it is unknown), and preferring
// it because the directory existed sent the transfer suite into ClassNotFoundException for netty and Commons Lang
// with nothing saying why. The JSON is NOT proof that prepare finished -- it is the first file prepare writes -- so
// the transferTest guard below also names any library the JSON lists that is not on disk.
def devMinecraftPrepared = new File(devMinecraft, 'versions/26.2/26.2.json').isFile()
if (devMinecraft.isDirectory() && !devMinecraftPrepared && !project.hasProperty('forbric.mcLibraries') && !System.getenv('MC_DIR'))
	logger.lifecycle("[forbric] ${devMinecraft} has no versions/26.2/26.2.json, so Minecraft's libraries come from " +
			"${defaultMinecraft}; run `python tools/dev.py prepare` to restore it")
def mcLibraries = file(project.findProperty('forbric.mcLibraries')
		?: (System.getenv('MC_DIR') ? System.getenv('MC_DIR') + '/libraries'
				: new File(devMinecraftPrepared ? devMinecraft : defaultMinecraft, 'libraries')))
// One jar PER PATTERN, never one across all of them: a single fileTree over several includes and a global
// takeRight(1) keeps whichever name sorts last and silently drops the rest — with brigadier and datafixerupper
// in the same tree, 'd' > 'b' and brigadier disappears. Last-by-NAME within a pattern is not version-aware
// either ("10.0.21" sorts before "9.0.19"); that is tolerable only because any version of these two satisfies
// javac's need to READ the class files, which is all they are here for.
def lastByNameUnder = { String pattern ->
	mcLibraries.isDirectory()
			? fileTree(mcLibraries) { include pattern }.files.sort { it.name }.takeRight(1)
			: []
}
// datafixerupper for the same reason as brigadier, one type further in: net.minecraft.core.Registry implements
// com.mojang.serialization.Keyable, so javac cannot read Registry — and so cannot read BuiltInRegistries —
// without it. KernelParticleProviders needs the particle registry to translate its keys.
def stagedMcLibraries = lastByNameUnder('com/mojang/brigadier/**/*.jar') +
		lastByNameUnder('com/mojang/datafixerupper/**/*.jar') +
		// gson, for the same reason and one layer out: fabric-api's resource-condition evaluator takes a
		// JsonObject, so KernelFabricConditions cannot name its own argument without it. Taken from the same
		// local Minecraft install as the other two, never bundled — the game supplies it at runtime.
		lastByNameUnder('com/google/code/gson/**/*.jar') +
		// netty's buffer types, for the same reason: KernelRecipeSync trial-encodes a recipe into a
		// RegistryFriendlyByteBuf, which IS a netty ByteBuf, so javac cannot read it without them. Never bundled.
		lastByNameUnder('io/netty/netty-buffer/**/*.jar') +
		lastByNameUnder('io/netty/netty-common/**/*.jar')

// LazyOptional's real carrier implementation uses Commons Lang's Mutable types, and every Team Reborn Energy store
// initialises Reborn's EnergyStorage interface, whose static fields build an Identifier and a DataComponentType
// (netty, joml, ...). Resolve Minecraft 26.2's OWN library set from its version JSON (the one launch-kernel-server.sh
// puts on the game's classpath), rather than a stub or whichever cached jar happens to sort last. This is test
// runtime linkage only and is never bundled.
def stagedTransferTestLibraries = []
// Libraries the JSON lists for every platform (no OS rules) that are not on disk. Those with rules are natives for one
// OS, so the other platforms' copies being absent is normal.
def missingTransferTestLibraries = []
def stagedMcVersionJson = new File(mcLibraries.parentFile, 'versions/26.2/26.2.json')
if (stagedMcVersionJson.isFile()) {
	def versionMetadata = new groovy.json.JsonSlurper().parse(stagedMcVersionJson)
	versionMetadata.libraries.each { library ->
		def relativePath = library.downloads?.artifact?.path
		if (relativePath) {
			def artifact = new File(mcLibraries, relativePath)
			if (artifact.isFile()) stagedTransferTestLibraries.add(artifact)
			else if (!library.rules) missingTransferTestLibraries.add(relativePath)
		}
	}
}

sourceSets {
	// `main` keeps the Gradle defaults (src/main/java, src/main/resources). Re-declaring them with srcDir would
	// ADD the same directory a second time, and every resource would then be a duplicate entry — which fails
	// processResources outright (it did, the moment the Mixin META-INF/services files landed).
	//
	// GAME side: everything that references net.minecraft.* / net.minecraftforge.* / net.neoforged.* /
	// net.fabricmc.fabric.* — defined by ForbricClassLoader at runtime, packaged as forbric-kernel-runtime.jar and
	// appended to the game classpath (NOT a fabric mod). Typed against the staged jars instead of reflected.
	// If the staged jars are absent, this set has nothing to link against; the guard task below fails loudly with
	// the build script to run, and `compileRuntimeJava` / `test` skip it so M0 (boot-side only) still builds.
	runtime {
		java { srcDir 'src/runtime/java' }
		compileClasspath += sourceSets.main.output + files(stagedGameJars) + files(stagedMcLibraries) + transferModuleFiles + files(stagedRebornEnergy)
		runtimeClasspath += sourceSets.main.output + files(stagedGameJars) + files(stagedMcLibraries) + transferModuleFiles + files(stagedRebornEnergy)
	}
	transferTest {
		java { srcDir 'src/transferTest/java' }
		compileClasspath += sourceSets.runtime.output + sourceSets.runtime.compileClasspath
		runtimeClasspath += sourceSets.runtime.output + sourceSets.runtime.compileClasspath + files(stagedTransferTestLibraries)
	}
	// A stand-in for Mod Menu's API (com.terraformersmc.modmenu.api): the interface every Fabric mod with a config
	// screen implements, and the only place a Fabric mod ever says it has one. Compiled against the game side, and
	// shipped INSIDE the game-side jar as resources, never as classes -- see runtimeJar. A class file there would be
	// one of ForbricClassLoader's own, found before any mod's, and would shadow a real Mod Menu. As resources they
	// are offered by ModMenuApiStandIn only when no installed jar has the real API, and the loader consults offered
	// bytes only after every owned jar has missed, so a real Mod Menu always wins.
	modMenuApi {
		java { srcDir 'src/modmenuApi/java' }
		compileClasspath += sourceSets.runtime.output + sourceSets.main.output + files(stagedGameJars) + files(stagedMcLibraries)
	}
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

configurations {
	// runtime source set inherits the boot-side library deps (asm etc.) for compilation.
	runtimeImplementation.extendsFrom implementation
	runtimeCompileOnly.extendsFrom compileOnly
	// MixinExtras — JiJ-nested into the runtime jar (game-side), never parent-loaded (LocalRef generated-class law).
	nestedMods
	transferTestImplementation.extendsFrom testImplementation
	transferTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	compileOnly 'org.jetbrains:annotations:23.0.0'
	// log4j-api is provided by Minecraft at runtime; boot-side diagnostics link against it compileOnly and fall
	// back to System.err when absent (unit tests, --scan tooling).
	compileOnly 'org.apache.logging.log4j:log4j-api:2.24.3'

	// --- Pure-bytecode / mapping / data machinery (same coordinates as the substrate) ---
	api "org.ow2.asm:asm:${project.asm_version}"
	api "org.ow2.asm:asm-analysis:${project.asm_version}"
	api "org.ow2.asm:asm-commons:${project.asm_version}"
	api "org.ow2.asm:asm-tree:${project.asm_version}"
	api "org.ow2.asm:asm-util:${project.asm_version}"
	api "net.fabricmc:sponge-mixin:${project.mixin_version}"
	api "org.ow2.sat4j:org.ow2.sat4j.core:${project.sat4j_version}"
	api "org.ow2.sat4j:org.ow2.sat4j.pb:${project.sat4j_version}"
	api "net.fabricmc:tiny-remapper:${project.tiny_remapper_version}"
	api "net.fabricmc:class-tweaker:${project.class_tweaker_version}"
	api "net.fabricmc:mapping-io:${project.mapping_io_version}"

	nestedMods "io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"
	// The game side names MixinExtras' Operation (KernelWrapOperations); the game supplies the nested copy above.
	runtimeCompileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"

	// TOML (mods.toml) + JSON (fabric.mod.json) readers — same libs the ecosystems use.
	api "com.electronwill.night-config:core:${project.night_config_version}"
	api "com.electronwill.night-config:toml:${project.night_config_version}"
	api "com.electronwill.night-config:json:${project.night_config_version}"

	// fastutil, for the GAME side only. ParticleResources' vanilla-typed `providers` field is an Int2ObjectMap,
	// and KernelParticleProviders has to hand it one. None of the three staged artifacts carries fastutil (zero
	// it/unimi entries in any of them) — Minecraft supplies it at runtime, exactly like brigadier. Pinned from
	// Maven rather than picked out of the local launcher's library tree, which holds several versions and would
	// make the runtime set's classpath a function of what that launcher happened to cache. compileOnly, never
	// bundled, and never resolved on a machine with no staged jars: compileRuntimeJava is already skipped there.
	runtimeCompileOnly 'it.unimi.dsi:fastutil:8.5.18'

	// Guava, GAME side only, for the same reason and on the same terms as fastutil: several vanilla signatures
	// return com.google.common.collect.ImmutableList (StateDefinition.getPossibleStates among them), so javac
	// cannot read those methods without it. Minecraft supplies it at runtime; the kernel never ships it. Pinned
	// from Maven rather than the local launcher's tree, which holds three versions here — any of them satisfies
	// javac's need to READ the class files, which is all this is for, so the pin is about reproducibility.
	runtimeCompileOnly 'com.google.guava:guava:33.6.0-jre'

	// JOML, GAME side only, on the same terms: fog data carries its colour as a Vector4f, and the MinecraftForge fog
	// event KernelGameClientEvents posts takes it. Pinned to the version Minecraft 26.2 lists.
	runtimeCompileOnly('org.joml:joml:1.10.8') { transitive = false }

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	// Compiled against too: FixturePolicyExtensionTest launches a nested run to prove the suite loads its extension.
	testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

// The GAME-side set only compiles when the staged jars exist. Point developers at the pipeline otherwise.
tasks.named('compileRuntimeJava') {
	onlyIf {
		if (stagedGameJars.isEmpty()) {
			logger.lifecycle('compileRuntimeJava: SKIPPED — staged game jars absent. Run prepareDev first ' +
						'(or python3 ../tools/dev.py prepare), then build in a second invocation.')
			return false
		}
		return true
	}
	// Here rather than in extractTransferApis: with no jar that task has no source, and Gradle skips it unrun.
	doFirst {
		if (stagedGameJars.size() != 3) throw new GradleException("Incomplete staged game inputs: "
				+ stagedGameJars.size() + "/3 under ${stagedRoot}. Run prepareDev before building the game side.")
		if (!stagedFabricApi.isFile()) throw new GradleException("The kernel game side includes its transfer " +
				"component and compiles it against Fabric API's transfer modules, but ${stagedFabricApi} does not " +
				"exist. Pass -Pforbric.fabricApi=<a fabric-api jar for 26.2> (the compatibility pack's is the default).")
	}
}
// No outputs, so never up to date: it runs whenever the game side is built.
def energyApiContract = file('src/main/resources/net/forbric/kernel/interop/protocol/energy.api-contract.txt')
def verifyRebornEnergy = tasks.register('verifyRebornEnergy', JavaExec) {
	description = 'Checks the energy adapter public binary API, independent of jar version or implementation hash.'
	onlyIf { !stagedGameJars.isEmpty() }
	dependsOn tasks.named('classes'), extractTransferApis
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.forbric.kernel.metadata.ApiJarContract'
	inputs.file(energyApiContract).withPropertyName('energyApiContract')
	inputs.files(stagedRebornEnergy).withPropertyName('energyApiImplementation').optional()
	doFirst {
		if (!stagedRebornEnergy.isFile()) throw new GradleException("The energy adapter needs a jar exposing its public API: " +
				stagedRebornEnergy + ". Pass -Pforbric.rebornEnergy=<compatible energy API jar>.")
		setArgs([energyApiContract.absolutePath, stagedRebornEnergy.absolutePath] +
				transferModuleFiles.files.collect { it.absolutePath })
	}
}
tasks.named('compileRuntimeJava') { dependsOn verifyRebornEnergy }
// Links against the game side, so it is built exactly when the game side is.
tasks.named('compileModMenuApiJava') {
	onlyIf { !stagedGameJars.isEmpty() }
}

test {
	useJUnitPlatform()
	// Gradle's default test-worker heap is 512 MB. Several staged tests hold the whole merged base in memory
	// (ForgeCapabilityProtocolTest, ModifiableDataViewsTransformerTest, ForgeCapabilityTokenInjectorExecutionTest,
	// FurnaceTickCallsInjectorTest: 480-509 MB live, measured with -Xlog:gc), so the default left a few MB of headroom
	// and a G1 humongous allocation after an unrelated test could end the worker with OutOfMemoryError.
	maxHeapSize = '1g'
	// Transport proofs need the new hash-indexed base; an old base is an explicit negative control.
	def predicateBase = file(project.findProperty('forbric.predicateBase') ?: stagedMergedBase)
	inputs.files(predicateBase).withPropertyName('predicateNativeBase').optional()
	systemProperty 'forbric.predicateBase', predicateBase.absolutePath
	// Optional final-definition evidence lets the staged source-continuation test replay a real weave.
	def sharedFinalDefined = project.findProperty('forbric.sharedFinalDefined')
	if (sharedFinalDefined != null) {
		def definitions = file(sharedFinalDefined)
		inputs.files(fileTree(definitions)).withPropertyName('sharedFinalDefined').optional()
		systemProperty 'forbric.sharedFinalDefined', definitions.absolutePath
	}
	// These integration fixtures read the released Create Fly jar, so replacing it must invalidate the tests. A
	// file collection, not inputs.file: a fresh clone (and CI) has no such jar, and the tests skip without it.
	def createFlyFixture = file(project.findProperty('forbric.createFlyJar')
			?: 'build/compat-inputs/create-fly/create-fly.jar')
	inputs.files(createFlyFixture).withPropertyName('createFlyFixture').optional()
	systemProperty 'forbric.createFlyJar', createFlyFixture.absolutePath
	// Only EventChainAuditTest's own loader gets log4j (the real buses need it); the test classpath keeps none,
	// because several tests assert ForbricLog's fallback when log4j is absent.
	doFirst { systemProperty 'forbric.log4jApiForTests', configurations.compileClasspath.files.find { it.name.startsWith('log4j-api-') }?.absolutePath ?: '' }
	// Game-side tests that name MixinExtras (KernelWrapOperationsTest) load it beside build/classes/java/runtime.
	doFirst { systemProperty 'forbric.mixinExtrasForTests', configurations.nestedMods.files.find { it.name.startsWith('mixinextras-') }?.absolutePath ?: '' }
	// The real-Mixin weave harness (net.forbric.kernel.mixin.weave) runs each bootstrap in a child JVM on this
	// classpath, because Mixin's bootstrap is one-shot per JVM. Its fixtures include the mixin-outcome canary's
	// sources, read in place, so editing that canary must re-run the tests.
	doFirst { systemProperty 'forbric.weaveHarnessClasspath', sourceSets.test.runtimeClasspath.asPath }
	inputs.files(fileTree('canary/mixin-outcome')).withPropertyName('weaveCanaries')
	// Component/decision tests do not own macOS's first UI thread. Actual windows are exercised
	// by the separately forked dialog/client gates, not by the Gradle worker's AppKit instance.
	systemProperty 'java.awt.headless', 'true'
	// The GAME-side output is an INPUT to these tests, and Gradle cannot see that on its own.
	//
	// Several tests load src/runtime classes through a URLClassLoader over build/classes/java/runtime -- it is the
	// only way to drive game-side code off-game, and it is a file path rather than a declared dependency. So
	// `test` was UP-TO-DATE after a runtime-source edit: the suite reported green against the PREVIOUS compile,
	// and a mutation check on any of those classes silently proved nothing. That trap is written down in the wall
	// ledger from the last time it cost a day; this is the fix rather than the note.
	dependsOn tasks.named('compileRuntimeJava')
	inputs.files(sourceSets.runtime.output).withPropertyName('gameSideClasses').optional()
	// The same for the Mod Menu API stand-in, which ModMenuApiStandInShapeTest reads off build/classes/java/modMenuApi.
	dependsOn tasks.named('compileModMenuApiJava')
	inputs.files(sourceSets.modMenuApi.output).withPropertyName('modMenuApiStandIn').optional()
	// NoRawAssumptionsTest reads the test sources and its allowlist as TEXT. An allowlist edit changes no class, so
	// without these the task stayed UP-TO-DATE and kept the verdict on the previous list.
	inputs.file('src/test/raw-assumption-allowlist.txt').withPropertyName('rawAssumptionAllowlist')
	inputs.files(fileTree('src/test/java'), fileTree('src/transferTest/java')).withPropertyName('testSourceText')
	// ProcessBuilder tests execute these files; their edits must invalidate the test task too.
	inputs.files(fileTree('run/compat') { include '**/*.py', '**/*.sh', '**/*.md' })
			.withPropertyName('compatibilityTools').optional()
	inputs.files(fileTree('run') { include 'gate-m*.sh', 'lib.sh' })
			.withPropertyName('gateContracts').optional()
	inputs.files(fileTree(stagedRoot) {
		include 'build-testmods.sh', 'livemod-src/**', 'livemod-src-neoforge/**',
				'forge-runtime/forbriclive.jar', 'neoforge-runtime/forbricneolive.jar'
	}).withPropertyName('compatibilityCanaries').optional()
	inputs.files(fileTree('build/compat-inputs') { include '**/mods/*.jar' })
			.withPropertyName('compatibilityModFixtures').optional()
	// The merged game the real-bytecode tests read. Without this, rebuilding it leaves the test task UP-TO-DATE
	// and every one of those tests silently keeps its previous verdict — which is exactly what happened the
	// first time the base was rebuilt: a green run that had not looked at the new jar at all.
	//
	// Through stagedRoot, NOT the literal path: these three lines hardcoded '../forbric-loader/run/...' while
	// the variable that honours FORBRIC_OLD was declared thirty lines up and already used by the canary inputs.
	// On a second worktree -- the one configuration FORBRIC_OLD exists for -- the declared input was a file that
	// does not exist, so rebuilding the real merged base left `test` UP-TO-DATE and every bytecode test kept its
	// previous verdict. That is the exact failure these lines were added to prevent, reintroduced by the knob
	// meant to support the case.
	inputs.files(files(stagedMergedBase))
			.withPropertyName('mergedBase').optional()
	// The two carriers, for exactly the same reason, one artifact over. About twenty test classes read them --
	// ForeignTypeCarrierTest checks every ForeignType name against them, CarrierAccessTransformerTest reads the
	// real AT out of them -- and none of that was declared. So a carrier upgrade, which is the single event those
	// tests exist to catch, left `test` UP-TO-DATE and every one of them silently kept its previous verdict.
	inputs.files(files(stagedForgeRuntime))
			.withPropertyName('forgeCarrier').optional()
	inputs.files(files(stagedNeoRuntime))
			.withPropertyName('neoforgeCarrier').optional()
	// The bytecode tests find the staged jars themselves, through FORBRIC_OLD, so hand them the root this build
	// compiled against. -Pforbric.stagedRoot used to move the compile and the declared inputs and leave the tests
	// reading another base, the same divergence a release capture now refuses (evidence.py stagedBuildInputs).
	environment 'FORBRIC_OLD', stagedRoot.parentFile.absolutePath
	systemProperty 'forbric.stagedRoot', stagedRoot.absolutePath
	// The same for Minecraft's own jar and libraries (TestFixtures.minecraftDir): the directory the game side compiled
	// against, so a prepared .dev/minecraft or -Pforbric.mcLibraries reaches the tests instead of a platform default.
	environment 'MC_DIR', mcLibraries.parentFile.absolutePath
	systemProperty 'forbric.fabricApi', stagedFabricApi.absolutePath
	// Refused when the tests RUN, never while the build is configured: this block configures every invocation,
	// and a root that does not exist is the documented way to build the boot jar as a machine without staged
	// artifacts would (above). run/test-staged-root.sh checks both halves.
	doFirst {
		if (stagedRoot.name != 'run') throw new GradleException("forbric.stagedRoot must name a run/ directory, as"
				+ " FORBRIC_OLD/run does: the tests resolve FORBRIC_OLD + '/run'. Got ${stagedRoot}")
	}
	// No unit test may fork a window. DependencyAuditTest drives DependencyAudit.report with Side.CLIENT and
	// deliberately unmet requirements, which is exactly the input that opens one -- and a test suite that stops
	// on an invisible dialog looks like a hang, not a failure. DependencyDialogTest drives the fork itself, with
	// its own explicit flags, so it does not need this to be on.
	systemProperty 'forbric.dependencyDialog', 'off'
}

// The engine tests need the whole game side. Without staged game jars they are skipped and say so, except in an
// integration run, where -Pforbric.requireTransfer=true turns that skip into a failure.
def transferSuiteRuns = { String task ->
	if (stagedGameJars.size() == 3 || requireTransfer) return true
	logger.lifecycle("${task}: SKIPPED — staged game jars absent (${stagedGameJars.size()}/3 under ${stagedRoot})")
	return false
}
tasks.named('compileTransferTestJava') {
	onlyIf { transferSuiteRuns('compileTransferTestJava') }
	// Thrown from an action, not from onlyIf, where Gradle would bury the message under "could not evaluate spec".
	doFirst {
		if (stagedGameJars.size() != 3) throw new GradleException("The staged game jars are absent (" +
				"${stagedGameJars.size()}/3 under ${stagedRoot}), and -Pforbric.requireTransfer=true forbids skipping " +
				"the transfer engine tests")
	}
}
tasks.register('transferTest', Test) {
	description = 'Exercises transfer conservation and nested rollback using the real Fabric/NeoForge transaction engines.'
	// The Reborn jar is on this classpath at RUN time too; an up-to-date compile does not re-check it.
	dependsOn verifyRebornEnergy
	onlyIf { transferSuiteRuns('transferTest') }
	testClassesDirs = sourceSets.transferTest.output.classesDirs
	classpath = sourceSets.transferTest.runtimeClasspath
	useJUnitPlatform()
	// Resolved at execution, NOT configuration. The classpath includes the extracted API modules, and read at
	// configuration time on a clean build directory that glob is still empty: every scenario then failed with
	// NoClassDefFoundError on the first run after `clean` and passed on the second.
	doFirst { systemProperty 'forbric.transferTestClasspath', classpath.asPath }
	// Without Minecraft's own library set every scenario fails on a ClassNotFoundException for a netty or Commons
	// Lang class, which reads as a transfer bug. Say what is missing instead. A run narrowed with --tests may be
	// after a scenario that needs none of it, so that one only warns.
	doFirst {
		def problem = !stagedMcVersionJson.isFile()
				? "${stagedMcVersionJson} is absent, so Minecraft 26.2's library list is unknown"
				: !missingTransferTestLibraries.isEmpty()
						? "${missingTransferTestLibraries.size()} of the libraries ${stagedMcVersionJson} lists are not under " +
								"${mcLibraries}: ${missingTransferTestLibraries.take(5).join(', ')}"
						: null
		if (problem == null) return
		def advice = "Point -Pforbric.mcLibraries or MC_DIR at a Minecraft install that has run 26.2, or run " +
				"`python tools/dev.py prepare`"
		if (filter.commandLineIncludePatterns.isEmpty()) throw new GradleException("The transfer suite needs Minecraft's " +
				"own libraries: ${problem}. ${advice}")
		logger.warn("[forbric] transferTest: ${problem}; a scenario that loads Minecraft classes will fail. ${advice}")
	}
}
tasks.named('check') { dependsOn tasks.named('transferTest') }

// BOOT jar: parent-loaded kernel core (classloading, discovery, resolve, transform, mixin service, mapping, access,
// metadata, vendored fabric api surface). No game types.
//
// MixinExtras rides along under META-INF/jars. It must NOT be parent-loaded (the LocalRef generated-class law: its
// generated classes must share the game's loader), so the boot orchestrator extracts it and hands it to
// ForbricClassLoader as an owned jar. Bundling keeps the kernel self-sufficient — no launcher-supplied path.
jar {
	archiveBaseName = 'forbric-kernel'
	into('META-INF/jars') {
		from configurations.nestedMods
		rename '.*\\.jar', 'mixinextras-fabric.jar'
	}
}

// GAME jar: forbric-kernel-runtime — the half ForbricClassLoader defines, compiled against the staged jars.
//
// It does NOT nest MixinExtras. The boot jar above already carries it and KernelBundledJars extracts it; a
// second copy here would ride inside an owned jar where nothing reads nested jars, so it would be a megabyte of
// dead weight AND a second place to update when the version moves. One bundler owns it.
tasks.register('runtimeJar', Jar) {
	archiveBaseName = 'forbric-kernel-runtime'
	dependsOn 'compileRuntimeJava'
	from sourceSets.runtime.output
	// Mod Menu's API stand-in, as bytes under META-INF and under a name no class loader resolves: see the modMenuApi
	// source set and ModMenuApiStandIn, which reads them from here.
	from(sourceSets.modMenuApi.output.classesDirs) {
		include '**/*.class'
		into 'META-INF/forbric/modmenu-api'
		rename { String file -> file + '.bin' }
	}
	// The boot seam requires exactly these three when the transfer APIs are installed; a jar without them is a
	// release that turns every fabric-api pack into a required loss. Checked on the artifact itself.
	doLast {
		def entries = new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip -> Collections.list(zip.entries())*.name as Set }
		// The stand-in is there, and only as resources. A loadable com/terraformersmc class in this jar would be
		// defined ahead of a real Mod Menu's and break every mod that uses more of Mod Menu than its API.
		def loadable = entries.findAll { it.startsWith('com/terraformersmc/') }
		if (loadable) throw new GradleException("forbric-kernel-runtime.jar must not carry Mod Menu classes as classes: ${loadable.take(3)}")
		def standIn = ['api/ModMenuApi', 'api/ConfigScreenFactory', 'api/UpdateChecker', 'api/UpdateInfo', 'api/UpdateChannel',
				'util/NullScreenFactory']
				.collect { "META-INF/forbric/modmenu-api/com/terraformersmc/modmenu/${it}.class.bin".toString() }
				.findAll { !entries.contains(it) }
		if (standIn) throw new GradleException("forbric-kernel-runtime.jar was built without its Mod Menu API stand-in: ${standIn}")
		def missing = ['BlockTransferBridge', 'TransferIssues', 'PairedTransactions', 'RebornEnergyBridge',
				'RebornEnergyAdapters', 'ForgeEnergyAdapters', 'EnergyUnits']
				.collect { "net/forbric/kernel/runtime/transfer/${it}.class".toString() }.findAll { !entries.contains(it) }
		if (missing) throw new GradleException("forbric-kernel-runtime.jar was built without its transfer component: ${missing}")
		// Team Reborn Energy is the player's mod, compiled against and never shipped.
		def bundled = entries.findAll { it.startsWith('team/reborn/') }
		if (bundled) throw new GradleException("forbric-kernel-runtime.jar must not bundle Team Reborn Energy: ${bundled.take(3)}")
	}
}

// Carry the game-side jar INSIDE the boot jar, next to MixinExtras and delivered the same way — so the kernel
// stays one file and neither a launcher nor the installer has to learn a new path.
//
// Wired at CONFIGURATION time and only when the staged jars are present. That is the whole reason this is an
// `if` and not an `onlyIf`: `onlyIf` skips the task but keeps the wiring, so a machine without staged artifacts
// would still get an `into` block sourced from a jar that was never built — which packs an EMPTY runtime jar,
// and an empty one is worse than none at all (every game-side class then fails to link at the moment of use,
// far from the cause). With the wiring itself absent, `gradlew jar` on such a machine is byte-identical to what
// it was before this block existed, and the boot-side gate is untouched.
//
// Nothing is lost there either: this jar links against Mojang/Forge/Neo types, so a machine that cannot build
// it also cannot run the game that would load it. Its prerequisites ARE the game's prerequisites.
//
// This is a SIBLING of the MixinExtras block on purpose. `rename` is a property of the CopySpec it sits in, so
// putting this `from` inside that block would rename the runtime jar to mixinextras-fabric.jar and silently
// replace the wrong file.
if (!stagedGameJars.isEmpty()) {
	jar {
		dependsOn 'runtimeJar'
		into('META-INF/jars') {
			from tasks.named('runtimeJar').flatMap { it.archiveFile }
			rename '.*\\.jar', 'forbric-kernel-runtime.jar'
		}
	}
}

// Emits the boot-side runtime classpath so launch scripts can compose it with the game classpath.
tasks.register('printBootClasspath') {
	doLast { println sourceSets.main.runtimeClasspath.asPath }
}

// Development workflow. Preparation runs in a separate invocation because runtime wiring is configured above.
def devDriver = file('../tools/dev.py')
def devPython = project.findProperty('forbric.python') ?: (osName.contains('windows') ? 'python' : 'python3')
tasks.register('prepareDev', Exec) {
	group = 'development'
	description = 'Download and assemble isolated development game inputs using the installer pipeline.'
	workingDir projectDir.parentFile
	commandLine devPython, devDriver, 'prepare', '--java', System.getProperty('java.home')
	// The canary mods take sponge-mixin and ASM from this classpath; without it dev.py would start a second build here.
	doFirst { environment 'FORBRIC_KERNEL_CLASSPATH', sourceSets.main.runtimeClasspath.asPath }
}
tasks.register('devDoctor', Exec) {
	group = 'development'
	description = 'Read-only development prerequisite check; exit 2 means preparation is needed.'
	workingDir projectDir.parentFile
	commandLine devPython, devDriver, 'doctor', '--java', System.getProperty('java.home')
}
tasks.register('toolTest', Exec) {
	group = 'verification'
	description = 'Run portable development and compatibility tooling self-tests without staged game jars.'
	workingDir projectDir.parentFile
	commandLine devPython, devDriver, 'tool-test'
}
tasks.named('check') { dependsOn 'toolTest' }
tasks.register('linkToolTest', Exec) {
	group = 'verification'
	description = 'Run the installer packaged-link-gate tests on synthetic jars, without game inputs or bootstrap.'
	workingDir file('../forbric-kernel-installer')
	commandLine(osName.contains('windows') ? ['cmd', '/d', '/c', 'gradlew.bat', 'linkGateTest'] : ['./gradlew', 'linkGateTest'])
}
tasks.named('check') { dependsOn 'linkToolTest' }
// The suites whose tests ran in THIS invocation. Results left by an earlier invocation are not evidence.
def executedSuites = Collections.synchronizedSet(new HashSet<String>())
// Fixture file names are Unicode ("[钠] sodium-fabric-….jar"). A JVM started under the C/POSIX locale cannot encode
// them and throws InvalidPathException; minimal Linux images and containers start there. tools/dev.py never saw it
// because Python coerces that locale for its children, but a plain ./gradlew does not.
def inheritedLocale = ['LC_ALL', 'LC_CTYPE', 'LANG'].collect { System.getenv(it) }.find { it }
def utf8TestLocale = osName.contains('linux') && !(inheritedLocale ==~ /(?i).*utf-?8.*/)
tasks.withType(Test).configureEach {
	def suiteName = name
	if (utf8TestLocale) environment 'LC_ALL', 'C.UTF-8'
	inputs.property('strictIntegration', strictIntegration)
	inputs.property('skipBaseline', skipBaseline ?: '')
	// The fixtures whose absence fails instead of skipping (TestFixtures.Fixture ids, or 'all'), read by
	// TestFixtures and FixturePolicyExtension. An integration run requires all of them, at the test that skipped
	// rather than only in the totals afterwards.
	systemProperty 'forbric.requireFixtures', project.findProperty('forbric.requireFixtures') ?: (strictIntegration ? 'all' : '')
	// A previous permissive result must never bypass the no-skips verdict of an integration invocation, and the
	// skip ratchet must judge tests that ran now.
	outputs.upToDateWhen { !strictIntegration && skipBaseline == null }
	def totals = [tests: 0, skipped: 0]
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			executedSuites.add(suiteName)
			totals.tests = result.testCount
			totals.skipped = result.skippedTestCount
			logger.lifecycle("${name}: ${result.testCount} tests, ${result.skippedTestCount} skipped, ${result.failedTestCount} failed")
		}
	}
	// After the task action, not in afterSuite: throwing there stopped the task before it wrote the reports this
	// message sends the reader to, so the skipped fixtures could not be looked up.
	doLast {
		if (strictIntegration && (totals.tests == 0 || totals.skipped > 0)) {
			throw new GradleException("${suiteName}: integrationTest requires executed assertions without skips; "
					+ "provide the fixtures reported in build/reports/tests/${suiteName}/index.html")
		}
	}
}
tasks.register('integrationTest') {
	group = 'verification'
	description = 'Run unit, transfer and tool tests strictly: missing game inputs or skipped assertions fail.'
	dependsOn 'test', 'transferTest', 'toolTest', 'linkToolTest'
	doFirst {
		if (stagedGameJars.size() != 3) throw new GradleException('integrationTest needs prepareDev first')
	}
	doLast {
		// Test callbacks are not invoked for NO-SOURCE tasks. Require concrete, nonempty results from both suites.
		['test', 'transferTest'].each { suite ->
			if (!executedSuites.contains(suite)) {
				throw new GradleException("integrationTest: ${suite} did not execute in this invocation; stale reports are not evidence")
			}
			def reports = fileTree("build/test-results/${suite}") { include 'TEST-*.xml' }.files
			def totals = [tests: 0, skipped: 0, failures: 0, errors: 0]
			def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
			factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
			reports.each { report ->
				def root = factory.newDocumentBuilder().parse(report).documentElement
				totals.keySet().each { key -> totals[key] += Integer.parseInt(root.getAttribute(key) ?: '0') }
			}
			if (totals.tests == 0 || totals.skipped > 0 || totals.failures > 0 || totals.errors > 0) {
				throw new GradleException("integrationTest: ${suite} needs executed, passing assertions without skips: ${totals}")
			}
		}
	}
}
tasks.register('skipRatchet', Exec) {
	group = 'verification'
	description = 'Fail when the tests skipped in this invocation differ from src/test/skip-baseline/<forbric.skipBaseline>.tsv.'
	onlyIf { skipBaseline != null }
	mustRunAfter 'test', 'transferTest'
	workingDir projectDir.parentFile
	doFirst {
		def command = [devPython, file('../tools/junit_report.py').absolutePath, 'ratchet', '--profile', skipBaseline,
				'--results', file('build/test-results').absolutePath, '--suites', 'test,transferTest',
				'--executed', executedSuites.join(','),
				'--baseline', file("src/test/skip-baseline/${skipBaseline}.tsv").absolutePath,
				'--actual', file("build/skip-baseline/skips-actual-${skipBaseline}.tsv").absolutePath,
				'--root', projectDir.parentFile.absolutePath]
		if (project.hasProperty('forbric.writeSkipBaseline')) command += '--write'
		commandLine command
	}
}
if (skipBaseline != null) tasks.named('check') { dependsOn 'skipRatchet' }
tasks.register('writeDevClasspath') {
	description = 'Write the current build paths for the portable launcher.'
	doLast {
		def destination = file('.dev/launch-build.json')
		destination.parentFile.mkdirs()
		destination.text = groovy.json.JsonOutput.toJson([
				bootJar: tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
				dependencies: configurations.runtimeClasspath.files.collect { it.absolutePath }])
	}
}
['Client', 'Server'].each { side ->
	tasks.register("run${side}", Exec) {
		group = 'development'
		description = "Launch the current source-built kernel ${side.toLowerCase()} after prepareDev."
		dependsOn 'jar', 'writeDevClasspath'
		workingDir projectDir.parentFile
		standardInput = System.in
		doFirst {
			if (stagedGameJars.size() != 3) throw new GradleException('Run prepareDev first, then runClient/runServer in a second invocation')
			def arguments = [devPython, devDriver, side.toLowerCase(), '--no-build',
					'--java', System.getProperty('java.home'), '--staged', stagedRoot.parentFile.absolutePath,
					'--mc-dir', mcLibraries.parentFile.absolutePath]
			if (project.hasProperty('forbric.instance')) arguments += ['--instance', file(project.property('forbric.instance')).absolutePath]
			if (project.hasProperty('forbric.acceptEula')) arguments += ['--accept-eula']
			if (project.hasProperty('forbric.dryRun')) arguments += ['--dry-run']
			commandLine arguments
		}
	}
}
