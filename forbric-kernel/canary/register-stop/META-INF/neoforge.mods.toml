displayName="Forbric Register Stop Canary"
description='''
Fails inside NeoForge's registration on purpose: its RegisterEvent listener throws (-Dforbric.registerstop=listener, the
default), or its mixin on GameData.postRegisterEvents throws right after a registry's dispatch (=try), or neither (=off).
'''
